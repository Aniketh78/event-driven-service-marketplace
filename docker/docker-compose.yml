version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 19092
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "19092"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  service-registry:
    image: booking-micro/service-registry:latest
    container_name: service-registry
    ports:
      - "8761:8761"

  config-server:
    image: booking-micro/config-server:latest
    container_name: config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      service-registry:
        condition: service_started

  api-gateway:
    image: booking-micro/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8082:8082"
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started

  auth-service:
    image: booking-micro/auth-service:latest
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started

  booking-service:
    image: booking-micro/booking-service:latest
    container_name: booking-service
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started

  supplier-service:
    image: booking-micro/supplier-service:latest
    container_name: supplier-service
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_started
